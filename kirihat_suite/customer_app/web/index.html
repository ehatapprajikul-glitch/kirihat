<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Kirihat - Online Grocery Shopping & Fast Delivery | Dhubri</title>
  <meta name="description"
    content="Kirihat - Your local grocery delivery app in Dhubri, Assam. Order fresh groceries, vegetables, fruits & essentials online. Get fast delivery in minutes!">
  <meta name="keywords"
    content="Kirihat, kirihat, kiri hat, kirihat app, kirihat grocery, grocery delivery, online grocery, Dhubri grocery, Assam delivery, quick commerce, fresh vegetables, instant delivery, local shopping">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://kirihat.com/app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kirihat">
  <meta property="og:title" content="Kirihat - Online Grocery Shopping & Fast Delivery">
  <meta property="og:description"
    content="Order fresh groceries, vegetables, fruits & essentials online. Fast delivery in Dhubri!">
  <meta property="og:image" content="https://kirihat.com/images/favicon.png">
  <meta property="og:url" content="https://kirihat.com/app/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kirihat - Online Grocery Shopping">
  <meta name="twitter:description" content="Fresh groceries delivered fast in Dhubri, Assam">
  <meta name="twitter:image" content="https://kirihat.com/images/favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kirihat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="shortcut icon" href="favicon.png?v=2">

  <!-- Theme Color -->
  <meta name="theme-color" content="#16a34a">

  <link rel="manifest" href="manifest.json">

  <!-- Structured Data for App -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Kirihat",
    "alternateName": ["Kiri Hat", "Kirihat App", "Kirihat Grocery"],
    "description": "Order fresh groceries, vegetables, fruits & essentials online with fast delivery in Dhubri, Assam",
    "url": "https://kirihat.com/app/",
    "applicationCategory": "ShoppingApplication",
    "operatingSystem": "Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.5",
      "ratingCount": "100"
    }
  }
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
