name: seller_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  kirihat_core:
    path: ../kirihat_core

  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.0
  image_picker: ^1.1.2
  http: ^1.2.2
  pinput: ^5.0.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.2
  pdf: ^3.10.4
  printing: ^5.11.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.0
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  sms_autofill: ^2.3.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  fl_chart: ^0.66.0
  file_picker: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/favicon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/favicon.png
